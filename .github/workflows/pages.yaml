name: Deploy the CellDL Editor app to GitHub Pages
# Builds the editor app (app/) with BG-RDF and serves it at https://<owner>.github.io/<repository>/

on:
  push:
    branches:
      - devel
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set the timezone to New Zealand
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: 'Pacific/Auckland'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install the dependencies
        run: bun install --frozen-lockfile

      - name: Run the unit tests
        run: bun run test

      - name: Build the editor app
        # `--base` overrides vite.config.ts's base (the upstream site's URL) with this repository's Pages path
        run: |
          ./scripts/install-bgrdf.sh
          bunx vite --config vite.config.ts build app --base "/${GITHUB_REPOSITORY#*/}/"
          bun scripts/generate.version.js

      - name: Upload the app
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
